name: Deploy Website
on: 
  push:
    branches:
      - feature
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code
        run: npm run lint
      - name: Run Test
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Build the Website
        run: npm run build
      - name: Upload Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: job-files
          path: |
            dist
            package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Job Artifacts
        uses: actions/download-artifact@v4
        with:
          name: job-files
      - name: Content Of the Artifact Folder
        run: ls
      - name: Deploy the Website
        run: echo "Deploying the website..."