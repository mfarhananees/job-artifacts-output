name: Deploy Website
on: 
  push:
    branches:
      - feature
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Caching Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code
        run: npm run lint
      - name: Run Test
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.print.outputs.JS-file}} 
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Caching Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Build the Website
        run: npm run build
      - name: Publish Js Filename
        id: print
        run: find dist/assets/*.js -type f -execdir echo 'JS-file={}' >> $GITHUB_OUTPUT ';'
      - name: Upload Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: job-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Job Artifacts
        uses: actions/download-artifact@v4
        with:
          name: job-files
      - name: Content Of the Artifact Folder
        run: ls
      - name: Output Java File Name
        run: echo "${{ needs.build.outputs.script-file }}"
      - name: Deploy the Website
        run: echo "Deploying the website..."